<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent MRI Image Analysis</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
            margin-bottom: 24px;
        }

        .upload-box:hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            fill: var(--accent-blue);
            margin-bottom: 12px;
        }

        .file-input {
            display: none;
        }

        .file-name-display {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-indigo));
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Intelligent MRI Image Analysis</h1>
    <p class="subtitle">Upload a brain MRI scan image (JPG, PNG, WEBP, BMP) for automated deep learning diagnosis.</p>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <div class="upload-box" onclick="document.getElementById('mri_image').click()">
            <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
            </svg>
            <p style="font-size: 0.95rem; font-weight: 500;">Click to select or drag & drop MRI image</p>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 6px;">Supported formats: JPG, JPEG, PNG, BMP, WEBP (Max: 16 MB)</p>
            <div id="fileName" class="file-name-display"></div>
        </div>

        <input type="file" id="mri_image" name="mri_image" class="file-input" accept="image/*" required onchange="showFileName(this)">

        <button type="submit" class="btn-submit">Analyze MRI Image</button>
    </form>
</div>

<script>
    function showFileName(input) {
        const fileNameDiv = document.getElementById('fileName');
        if (input.files && input.files[0]) {
            fileNameDiv.textContent = 'Selected: ' + input.files[0].name;
        } else {
            fileNameDiv.textContent = '';
        }
    }
</script>

</body>
</html>
